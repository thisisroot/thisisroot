name: arcade

# Rebuilds the live parts of the profile (hi-score table + contribution snake)
# and publishes them to the `output` branch, which README.md links to.

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Score the high-score table
        run: python3 scripts/arcade.py hiscore --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Feed the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#33ff66&color_dots=#0b140d,#0f3d1e,#1d7a3a,#26b552,#33ff66
            dist/snake-light.svg?color_snake=#0f7a32&color_dots=#ebedf0,#b7f5c8,#5fd884,#26b552,#0f7a32

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "arcade: rescore"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
